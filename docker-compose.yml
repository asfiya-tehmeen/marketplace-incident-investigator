services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mii
      POSTGRES_PASSWORD: mii
      POSTGRES_DB: incidents
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mii -d incidents"]
      interval: 2s
      retries: 20
volumes:
  pgdata:
